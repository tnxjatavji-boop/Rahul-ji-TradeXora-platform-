<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="txGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="50%" stop-color="#00b067" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="128" height="128" rx="28" fill="#0f172a" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Candlesticks in Background subtle -->
  <rect x="24" y="52" width="6" height="34" rx="1.5" fill="rgba(0,176,103,0.3)" />
  <line x1="27" y1="42" x2="27" y2="94" stroke="rgba(0,176,103,0.3)" stroke-width="2" />
  
  <rect x="98" y="44" width="6" height="38" rx="1.5" fill="rgba(0,136,204,0.3)" />
  <line x1="101" y1="36" x2="101" y2="90" stroke="rgba(0,136,204,0.3)" stroke-width="2" />

  <!-- Dynamic Lightning / Growth Bolt -->
  <path d="M68 18 L38 64 L62 64 L54 110 L94 56 L70 56 Z" fill="url(#txGrad)" filter="url(#glow)" />
</svg>
